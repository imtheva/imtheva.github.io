<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Redirecting…</title>
  <meta name="robots" content="noindex">
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #fafafa;
      color: #333;
    }
    .box { text-align: center; }
    a { color: #2a6df4; }
  </style>
</head>
<body>
  <div class="box">
    <p id="msg">Redirecting…</p>
  </div>

  <script>
    // Cache-bust so GitHub Pages / browser never serves a stale target.json
    fetch('target.json?_=' + Date.now())
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data && data.url) {
          window.location.replace(data.url);
        } else {
          document.getElementById('msg').textContent = 'No destination configured.';
        }
      })
      .catch(function () {
        document.getElementById('msg').innerHTML =
          'Could not load redirect target. <a href="/">Go to homepage</a>.';
      });
  </script>
</body>
</html>
