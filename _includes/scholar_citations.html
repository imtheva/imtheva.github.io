<!-- ============================================================
  _includes/scholar_citations.html
  
  Self-contained citation dashboard for al-folio.
  - Reads live citation numbers directly from the badge images
    already rendered on this page (the blue "scholar-N" shields)
  - Falls back to hardcoded data if badges aren't found
  - Full light / dark mode (system + al-folio's data-theme toggle)
  - Zero external dependencies beyond what al-folio already loads
  ============================================================ -->

<div id="scholar-dash" class="scholar-dash" aria-label="Google Scholar citation metrics">

  <!-- Top bar -->
  <div class="sd-topbar">
    <div>
      <div class="sd-heading">Citation Metrics</div>
      <div class="sd-subheading">Google Scholar · Thevathayarajh Thayananthan</div>
    </div>
    <a href="https://scholar.google.com/citations?user=MpKhKEUAAAAJ"
       target="_blank" rel="noopener" class="sd-ext-link">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
           stroke-linejoin="round" aria-hidden="true">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      View profile
    </a>
  </div>

  <!-- Stat cards -->
  <div class="sd-cards">
    <div class="sd-card">
      <span class="sd-card-label">Total citations</span>
      <span class="sd-card-value" id="sd-total">—</span>
    </div>
    <div class="sd-card">
      <span class="sd-card-label">h-index</span>
      <span class="sd-card-value" id="sd-hindex">3</span>
    </div>
    <div class="sd-card">
      <span class="sd-card-label">i10-index</span>
      <span class="sd-card-value" id="sd-i10">1</span>
    </div>
    <div class="sd-card">
      <span class="sd-card-label">Publications</span>
      <span class="sd-card-value" id="sd-pubs">—</span>
    </div>
  </div>

  <!-- Year chart -->
  <div class="sd-section-title">Citations by year</div>
  <div class="sd-year-chart" id="sd-year-chart" aria-label="Citations per year bar chart">
    <!-- Filled by JS -->
  </div>

  <!-- Per-paper bars -->
  <div class="sd-section-title" style="margin-top:1.6rem">Top cited papers</div>
  <div class="sd-papers" id="sd-papers">
    <!-- Filled by JS -->
  </div>

  <div class="sd-footer" id="sd-footer">
    Data sourced from badge counts on this page ·
    <a href="https://scholar.google.com/citations?user=MpKhKEUAAAAJ" target="_blank" rel="noopener">
      scholar.google.com/citations?user=MpKhKEUAAAAJ
    </a>
  </div>
</div>

<!-- ── Styles ──────────────────────────────────────────────────────── -->
<style>
/* Light theme tokens */
.scholar-dash {
  --c-bg:       #ffffff;
  --c-surface:  #f6f5f1;
  --c-track:    #e4e2db;
  --c-accent:   #2a5fc4;
  --c-accent2:  #16a37a;
  --c-text:     #18181a;
  --c-muted:    #6b6a65;
  --c-faint:    #a09e98;
  --c-border:   rgba(0,0,0,0.08);
  --c-shadow:   0 1px 3px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
  --r-sm: 6px;
  --r-md: 10px;
  --r-lg: 14px;
}

/* Dark mode — system preference */
@media (prefers-color-scheme: dark) {
  .scholar-dash {
    --c-bg:      #1a1a18;
    --c-surface: #252522;
    --c-track:   #353530;
    --c-accent:  #7aadff;
    --c-accent2: #4dd9a8;
    --c-text:    #eae8e0;
    --c-muted:   #a8a69e;
    --c-faint:   #68665e;
    --c-border:  rgba(255,255,255,0.07);
    --c-shadow:  0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
  }
}

/* Dark mode — al-folio's toggle writes data-theme="dark" on <html> */
[data-theme="dark"] .scholar-dash {
  --c-bg:      #1a1a18;
  --c-surface: #252522;
  --c-track:   #353530;
  --c-accent:  #7aadff;
  --c-accent2: #4dd9a8;
  --c-text:    #eae8e0;
  --c-muted:   #a8a69e;
  --c-faint:   #68665e;
  --c-border:  rgba(255,255,255,0.07);
  --c-shadow:  0 1px 3px rgba(0,0,0,0.3), 0 4px 16px rgba(0,0,0,0.2);
}

/* Container */
.scholar-dash {
  background: var(--c-bg);
  border: 1px solid var(--c-border);
  border-radius: var(--r-lg);
  box-shadow: var(--c-shadow);
  padding: 1.5rem 1.75rem 1.25rem;
  margin: 2rem 0 2.5rem;
  font-family: inherit;
  max-width: 820px;
  transition: background 0.2s, border-color 0.2s;
}

/* Top bar */
.sd-topbar {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 1.25rem;
  gap: 1rem;
}
.sd-heading {
  font-size: 15px;
  font-weight: 600;
  color: var(--c-text);
  letter-spacing: -0.015em;
}
.sd-subheading {
  font-size: 12px;
  color: var(--c-faint);
  margin-top: 2px;
}
.sd-ext-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  color: var(--c-accent);
  text-decoration: none;
  white-space: nowrap;
  padding: 4px 10px;
  border: 1px solid var(--c-border);
  border-radius: 20px;
  transition: background 0.15s;
}
.sd-ext-link:hover { background: var(--c-surface); text-decoration: none; }

/* Stat cards */
.sd-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 1.75rem;
}
@media (max-width: 560px) {
  .sd-cards { grid-template-columns: repeat(2, 1fr); }
}
.sd-card {
  background: var(--c-surface);
  border-radius: var(--r-md);
  padding: 0.9rem 1rem 0.75rem;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border: 1px solid var(--c-border);
}
.sd-card-label {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--c-faint);
}
.sd-card-value {
  font-size: 30px;
  font-weight: 600;
  color: var(--c-text);
  line-height: 1.05;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  /* Animate count-up */
  transition: color 0.3s;
}

/* Section titles */
.sd-section-title {
  font-size: 10.5px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--c-faint);
  margin-bottom: 0.75rem;
}

/* Year chart */
.sd-year-chart {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 120px;
}
.sd-yr-group {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  height: 100%;
  justify-content: flex-end;
}
.sd-yr-count {
  font-size: 11px;
  font-weight: 600;
  color: var(--c-muted);
  font-variant-numeric: tabular-nums;
}
.sd-yr-bar-wrap {
  width: 100%;
  flex: 1;
  display: flex;
  align-items: flex-end;
}
.sd-yr-bar {
  width: 100%;
  background: var(--c-accent);
  border-radius: 4px 4px 0 0;
  min-height: 4px;
  opacity: 0.85;
  transform-origin: bottom;
  transform: scaleY(0);
  animation: bar-grow 0.7s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
}
@keyframes bar-grow {
  to { transform: scaleY(1); }
}
.sd-yr-label {
  font-size: 10px;
  color: var(--c-faint);
  letter-spacing: 0.02em;
}

/* Paper list */
.sd-papers { display: flex; flex-direction: column; }
.sd-paper-row {
  display: grid;
  grid-template-columns: 1fr 44px 120px 30px;
  align-items: center;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid var(--c-border);
}
.sd-paper-row:last-child { border-bottom: none; }
.sd-paper-title {
  font-size: 12px;
  color: var(--c-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
}
.sd-paper-title a {
  color: inherit;
  text-decoration: none;
}
.sd-paper-title a:hover { color: var(--c-accent); }
.sd-paper-year {
  font-size: 11px;
  color: var(--c-faint);
  background: var(--c-surface);
  border: 1px solid var(--c-border);
  border-radius: 20px;
  padding: 2px 7px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.sd-paper-bar-wrap {
  height: 5px;
  background: var(--c-track);
  border-radius: 3px;
  overflow: hidden;
}
.sd-paper-bar {
  height: 100%;
  background: var(--c-accent);
  border-radius: 3px;
  width: 0;
  animation: bar-h-grow 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  animation-delay: var(--delay, 0s);
}
@keyframes bar-h-grow {
  to { width: var(--target-w, 0%); }
}
.sd-paper-count {
  font-size: 13px;
  font-weight: 600;
  color: var(--c-text);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

/* Total badge */
.sd-total-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  color: var(--c-accent2);
  font-weight: 600;
}

/* Footer */
.sd-footer {
  margin-top: 1.1rem;
  font-size: 10.5px;
  color: var(--c-faint);
  border-top: 1px solid var(--c-border);
  padding-top: 0.75rem;
}
.sd-footer a { color: var(--c-accent); text-decoration: none; }
.sd-footer a:hover { text-decoration: underline; }

@media (max-width: 500px) {
  .scholar-dash { padding: 1rem; }
  .sd-paper-row { grid-template-columns: 1fr 38px 80px 26px; gap: 7px; }
  .sd-card-value { font-size: 24px; }
}
</style>

<!-- ── Script: parse badge data already on the page ──────────────── -->
<script>
(function () {
  // ── Fallback data (used if badges aren't found) ──────────────────
  const FALLBACK = {
    papers: [
      { title: "Computer vision in livestock management", year: 2024, cites: 13, scholarId: "MpKhKEUAAAAJ:YsMSGLbcyi4C" },
      { title: "Engineering Applications in Livestock Production", year: 2024, cites: 8, scholarId: "MpKhKEUAAAAJ:WF5omc3nYNoC" },
      { title: "Traffic sign recognition for Sri Lankan drivers", year: 2024, cites: 5, scholarId: "MpKhKEUAAAAJ:_FxGoFyzp5QC" },
      { title: "Multi-ripeness blackberry detection (YOLOv7)", year: 2023, cites: 4, scholarId: "MpKhKEUAAAAJ:zYLM7Y9cAGgC" },
      { title: "CottonSim autonomous robotic cotton picker", year: 2025, cites: 3, scholarId: "MpKhKEUAAAAJ:hqOjcs7Dif8C" },
      { title: "Automating catfish cutting using deep learning", year: 2023, cites: 2, scholarId: "MpKhKEUAAAAJ:IjCSPb-OGe4C" },
      { title: "In-Field Multi-Ripeness Blackberry Detection", year: 2025, cites: 1, scholarId: "MpKhKEUAAAAJ:0EnyYjriUFMC" },
    ],
    yearData: { 2023: 6, 2024: 14, 2025: 16 },
    hindex: 3,
    i10: 1,
  };

  const SCHOLAR_USER = "MpKhKEUAAAAJ";

  // ── Parse badges already rendered on the page ────────────────────
  function scrapeBadges() {
    // al-folio renders <img> badges with alt="N Google Scholar citations"
    // and href links to scholar containing citation_for_view=SCHOLAR_ID:PAPER_ID
    const papers = [];

    // Find all scholar badge images
    document.querySelectorAll('img[alt*="Google Scholar"]').forEach(img => {
      const alt = img.alt || "";
      const countMatch = alt.match(/^(\d+)\s+Google Scholar/);
      if (!countMatch) return;
      const cites = parseInt(countMatch[1], 10);

      // Walk up to find the enclosing bib entry to get title + year
      const bibEntry = img.closest('li, .bibliography, div[id^="bib"]') ||
                       img.closest('div') || img.parentElement;

      // Get title — look for the nearby <a> or heading text
      let title = "";
      if (bibEntry) {
        const titleEl = bibEntry.querySelector('a[href*="doi"], .title, span.title, a');
        if (titleEl) {
          title = titleEl.textContent.trim().replace(/\s+/g, ' ');
        } else {
          // Just grab first meaningful text in the entry
          title = bibEntry.textContent.trim().split('\n')[0].trim().substring(0, 80);
        }
      }

      // Get scholar ID from the badge link (or nearby link)
      let scholarId = "";
      const badgeLink = img.closest('a[href*="citation_for_view"]') ||
                        img.parentElement.querySelector('a[href*="citation_for_view"]') ||
                        bibEntry && bibEntry.querySelector('a[href*="citation_for_view"]');
      if (badgeLink) {
        const m = badgeLink.href.match(/citation_for_view=([^&]+)/);
        if (m) scholarId = decodeURIComponent(m[1]);
      }

      // Try to extract year from the entry text
      let year = "";
      if (bibEntry) {
        const yearMatch = bibEntry.textContent.match(/\b(20\d{2})\b/);
        if (yearMatch) year = parseInt(yearMatch[1], 10);
      }

      if (title) {
        papers.push({ title, year, cites, scholarId });
      } else {
        papers.push({ title: `Paper (${cites} citations)`, year, cites, scholarId });
      }
    });

    return papers.sort((a, b) => b.cites - a.cites);
  }

  // ── Compute derived stats ────────────────────────────────────────
  function computeStats(papers) {
    const total = papers.reduce((s, p) => s + p.cites, 0);

    // h-index: largest h where ≥h papers have ≥h citations
    const sorted = [...papers].sort((a, b) => b.cites - a.cites);
    let h = 0;
    for (let i = 0; i < sorted.length; i++) {
      if (sorted[i].cites >= i + 1) h = i + 1;
      else break;
    }

    // i10-index
    const i10 = papers.filter(p => p.cites >= 10).length;

    return { total, hindex: h, i10 };
  }

  // ── Build year data from papers ──────────────────────────────────
  function buildYearData(papers) {
    const byYear = {};
    papers.forEach(p => {
      if (p.year) byYear[p.year] = (byYear[p.year] || 0) + p.cites;
    });
    return byYear;
  }

  // ── Animate count-up ─────────────────────────────────────────────
  function animateCount(el, target, duration) {
    const start = performance.now();
    function step(now) {
      const elapsed = now - start;
      const progress = Math.min(elapsed / duration, 1);
      const ease = 1 - Math.pow(1 - progress, 3); // cubic ease-out
      el.textContent = Math.round(ease * target);
      if (progress < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // ── Render ───────────────────────────────────────────────────────
  function render(papers, yearData, stats) {
    // Stat cards
    const totalEl = document.getElementById('sd-total');
    const pubsEl  = document.getElementById('sd-pubs');
    const hindexEl = document.getElementById('sd-hindex');
    const i10El   = document.getElementById('sd-i10');

    animateCount(totalEl,  stats.total,  900);
    animateCount(pubsEl,   papers.length, 600);
    animateCount(hindexEl, stats.hindex, 700);
    animateCount(i10El,    stats.i10,    700);

    // Year chart
    const chartEl = document.getElementById('sd-year-chart');
    const years = Object.keys(yearData).sort();
    const maxY = Math.max(...Object.values(yearData), 1);

    chartEl.innerHTML = years.map((yr, i) => {
      const cnt = yearData[yr] || 0;
      const pct = Math.max((cnt / maxY) * 100, 3);
      return `
        <div class="sd-yr-group">
          <span class="sd-yr-count">${cnt}</span>
          <div class="sd-yr-bar-wrap">
            <div class="sd-yr-bar"
                 style="height:${pct}%; animation-delay:${i * 0.08}s;"
                 aria-label="${yr}: ${cnt} citations"></div>
          </div>
          <span class="sd-yr-label">${yr}</span>
        </div>`;
    }).join('');

    // Paper list
    const papersEl = document.getElementById('sd-papers');
    const maxC = Math.max(...papers.map(p => p.cites), 1);

    papersEl.innerHTML = papers.filter(p => p.cites > 0).map((p, i) => {
      const pct = Math.round((p.cites / maxC) * 100);
      const titleHtml = p.scholarId
        ? `<a href="https://scholar.google.com/citations?view_op=view_citation&hl=en&user=${SCHOLAR_USER}&citation_for_view=${p.scholarId}" target="_blank" rel="noopener" title="${p.title}">${truncate(p.title, 70)}</a>`
        : `<span title="${p.title}">${truncate(p.title, 70)}</span>`;

      return `
        <div class="sd-paper-row">
          <div class="sd-paper-title">${titleHtml}</div>
          <span class="sd-paper-year">${p.year || '—'}</span>
          <div class="sd-paper-bar-wrap">
            <div class="sd-paper-bar"
                 style="--target-w:${pct}%; --delay:${0.05 + i * 0.06}s;"></div>
          </div>
          <span class="sd-paper-count">${p.cites}</span>
        </div>`;
    }).join('');
  }

  function truncate(str, n) {
    if (!str) return '';
    return str.length > n ? str.substring(0, n) + '…' : str;
  }

  // ── Main ─────────────────────────────────────────────────────────
  function init() {
    let papers = scrapeBadges();
    let yearData, stats;

    if (papers.length > 0) {
      stats    = computeStats(papers);
      yearData = buildYearData(papers);
      // If year data is sparse, supplement with fallback year totals
      if (Object.keys(yearData).length < 2) {
        yearData = FALLBACK.yearData;
      }
    } else {
      // No badges found — use fallback data entirely
      papers   = FALLBACK.papers;
      yearData = FALLBACK.yearData;
      stats    = computeStats(papers);
    }

    render(papers, yearData, stats);

    // Update footer timestamp
    const footer = document.getElementById('sd-footer');
    const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
    if (footer) footer.innerHTML = `Data sourced from badge counts on this page · ${today} · <a href="https://scholar.google.com/citations?user=${SCHOLAR_USER}" target="_blank" rel="noopener">scholar.google.com</a>`;
  }

  // Run after DOM settles (badges may load late)
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    // Already loaded — run slightly deferred so badges are in DOM
    setTimeout(init, 200);
  }

  // Also re-run if al-folio lazy-loads/re-renders bib content
  const observer = new MutationObserver(() => {
    const badges = document.querySelectorAll('img[alt*="Google Scholar"]');
    if (badges.length > 0) {
      observer.disconnect();
      init();
    }
  });
  observer.observe(document.body, { childList: true, subtree: true });
  // Stop observing after 5s regardless
  setTimeout(() => observer.disconnect(), 5000);
})();
</script>
