name: Update Scholar Citations

on:
  schedule:
    - cron: "0 4 * * 0" # every Sunday at 04:00 UTC
  workflow_dispatch: # manual "Run workflow" button in Actions tab

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install scholarly requests

      - name: Fetch citations from Google Scholar
        # SCRAPER_API_KEY is optional but strongly recommended.
        # Without it the script tries FreeProxies then direct HTML.
        # Add it: repo → Settings → Secrets → Actions → SCRAPER_API_KEY
        env:
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
        run: python _scripts/update_citations.py

      - name: Commit updated citations.json if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/citations.json
          git diff --cached --quiet \
            && echo "No changes to commit." \
            || git commit -m "chore: update scholar citations [skip ci]"
          git diff HEAD~1 --quiet 2>/dev/null || git push
