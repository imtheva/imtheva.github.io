name: Update Scholar Citations

on:
  schedule:
    - cron: "0 4 * * 0" # every Sunday at 04:00 UTC
  workflow_dispatch: # manual "Run workflow" button in Actions tab

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install requests

          # Install Playwright + Chromium for the zero-signup browser option
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Fetch citations
        env:
          # ── OPTION A: SerpAPI (free, no card — https://serpapi.com) ──
          # Add to repo → Settings → Secrets → Actions → SERP_API_KEY
          SERP_API_KEY: ${{ secrets.SERP_API_KEY }}

          # ── OPTION B: Playwright real browser (zero signup) ───────────
          # Change "false" to "true" below to use Playwright instead.
          # Only used if SERP_API_KEY is not set.
          USE_PLAYWRIGHT: "true"

        run: python _scripts/update_citations.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/citations.json
          git diff --cached --quiet \
            && echo "No changes to commit." \
            || (git commit -m "chore: update scholar citations [skip ci]" && git push)
