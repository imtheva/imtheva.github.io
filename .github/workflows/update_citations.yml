name: Update Scholar Citations

on:
  schedule:
    - cron: "0 4 * * 0"   # every Sunday at 04:00 UTC
  workflow_dispatch:        # manual "Run workflow" button in Actions tab

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install scholarly
        run: pip install scholarly

      - name: Fetch citations
        run: python _scripts/update_citations.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/citations.json
          git diff --cached --quiet && echo "No changes." && exit 0
          git commit -m "chore: update scholar citations [skip ci]"
          git push
