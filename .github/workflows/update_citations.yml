name: Update Scholar Citations

# ─────────────────────────────────────────────
# Runs automatically every Sunday at 04:00 UTC
# Can also be triggered manually from the
# GitHub Actions tab → "Run workflow"
# ─────────────────────────────────────────────
on:
  schedule:
    - cron: "0 4 * * 0"   # every Sunday 04:00 UTC
  workflow_dispatch:       # manual trigger button in GitHub UI

permissions:
  contents: write          # needed to push _data/citations.json back to the repo

jobs:
  update-citations:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history so git push works cleanly

      # 2. Set up Python
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install scholarly requests
          # If requirements.txt already lists these, use:
          # pip install -r requirements.txt

      # 4. Run the citation-update script
      - name: Fetch citations from Google Scholar
        run: python _scripts/update_citations.py
        env:
          # Playwright/selenium proxies can be configured here if Scholar
          # starts rate-limiting. Leave empty for plain requests for now.
          SCHOLAR_USE_PROXY: "false"

      # 5. Commit and push only if citations.json actually changed
      - name: Commit updated citations
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/citations.json
          # Exit cleanly if nothing changed
          git diff --cached --quiet && echo "No changes — skipping commit." && exit 0
          git commit -m "chore: update scholar citations [skip ci]"
          git push
